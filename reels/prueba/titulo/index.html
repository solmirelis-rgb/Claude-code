<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #1b1033;
        --ground-2: #e8436f;
        --ink: #ffffff;
        --accent: #ffd166;
        --font-display: "DejaVu Sans", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%; height: 100%; position: relative;
        background: linear-gradient(160deg, var(--ground) 0%, #5a1f6b 55%, var(--ground-2) 100%);
        font-family: var(--font-display);
      }
      .wrap {
        position: absolute; top: 420px; left: 0; width: 100%;
        display: flex; flex-direction: column; align-items: center; gap: 36px;
      }
      #kicker {
        color: var(--accent); font-size: 44px; font-weight: 700;
        letter-spacing: 0.2em; text-transform: uppercase;
      }
      #title {
        color: var(--ink); font-size: 150px; font-weight: 800;
        letter-spacing: -0.03em; line-height: 1; text-align: center;
      }
      #bar { width: 0px; height: 14px; border-radius: 7px; background: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13"
         data-width="1080" data-height="1920">
      <div class="wrap clip" data-start="0" data-duration="13" data-track-index="0">
        <div id="kicker">Prueba</div>
        <h1 id="title">Mi primer<br />reel</h1>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#title", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.8)" }, 0.5);
      tl.to("#bar", { width: 420, duration: 0.7, ease: "power2.inOut" }, 1.2);
      tl.to("#title", { scale: 1.06, duration: 11, ease: "none" }, 1.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
